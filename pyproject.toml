[project]
name = "si-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.3",
    "langgraph>=1.2.22",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "watchdog>=7.1.0",
]

[project.scripts]
si-agents = "si_agents:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
